name: 04- Using Actions
on: push


jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: 04-using-actions/react-app
        steps:
        - name: Checkout Code
          uses: actions/checkout@v7
        - name: Set up Node
          uses: actions/setup-node@v6
          with:
           node-version: '24.x'
        - name: Install Dependencies
          run: npm ci
        - name: Run unit tests
          run: npm run test
          
           