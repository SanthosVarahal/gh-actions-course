name: 11 - Working with Inputs
on:
    workflow_dispatch:
        inputs:
            dry-run:
                type: boolean
                description: "Skip deployment and only print build output"
                default: true
            target:
                type: environment
                required: true
                description: "Skip deployment and only print build output"
            tag:
                type: choice
                options:
                    - v1
                    - v2
                    - v3
                default: v3
                description: "Release from which to build and deploy"

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: build
              run: echo "Building...."
    deploy:
        runs-on: ubuntu-latest
        needs:
            - build
        steps:
            - name: Deploy
              run: echo "Deploying..."
