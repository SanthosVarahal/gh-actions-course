name: 02-workflow-events

on:
    push:
    pull_request:
    schedule:
        - cron: '*/5 * * * *'
    workflow_dispatch:
        
jobs:
    echo:
        runs-on: ubuntu-latest
        steps:
            - name: show the trigger
              run: echo "this workflow event was triggered by the ${{ github.event_name }} event"
      