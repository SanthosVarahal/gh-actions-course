name: 13 - Using Caching

on:
    workflow_dispatch:
        inputs:
            use-cache:
                type: boolean
                description: Whether to execute cache step
                default: true
                

jobs:
    build:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: 13-caching/template
        steps:
            - name: Checkout-code
              uses: actions/checkout@v7
            - name: Setup-node
              uses: actions/setup-node@v6
              with:
                node-version: 24.x
            - name: Install Dependencies
              run: npm ci
            - name: Testing
              run: npm run test
            - name: Building
              run: npm run build
            - name: Deploying
              run: echo "deploying to non-prod"
              
