name: 13 - Using Caching

on:
    workflow_dispatch:
        inputs:
            use-cache:
                type: boolean
                description: Whether to execute cache step
                default: true
            node-version:
                type: choice
                options:
                    - 24.x
                    - 26.x
                default: 24.x
                

jobs:
    install-dep:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: 13-caching/template
        outputs:
            deps-cache-key: ${{ steps.cache-key.outputs.CACHE_KEY }}
        steps:
            - name: checkout-code
              uses: actions/checkout@v7
            - name: Setup-node
              uses: actions/setup-node@v6
              with:
                node-version: ${{ inputs.node-version }}
            - name: calculate-cache-key
              id: cache-key
              runs: |
                echo "CACHE_KEY=deps-node-modules-${{ hashFiles('13-caching/template/package-lock.json') }} >> $GITHUB_OUTPUT"
            - name: Download cache dependencies
              if: ${{ inputs.use-cache }}
              id: cache
              uses: actions/cache@v6
              with:
                path: 13-caching/template/node_modules
                key: ${{ steps.cache.outputs.CACHE_KEY }}
            - name: Install Dependencies
              if: steps.cache.outputs.cache-hit != 'true'
              run: npm ci
    linting:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: 13-caching/template
        needs: install-dep
        steps:
            - name: checkout-code
              uses: actions/checkout@v7
            - name: Setup-node
              uses: actions/setup-node@v6
              with:
                node-version: ${{ inputs.node-version }}
            - name: Download cached dependencies
              if: ${{ inputs.use-cache }}
              id: cache
              uses: actions/cache@v6
              with:
                path: 13-caching/template/node_modules
                key: ${{ steps.cache.outputs.CACHE_KEY }}
            - name: Testing
              run: npm run test
            - name: Linting
              run: echo "Linting...."
              
        
    build:
        runs-on: ubuntu-latest
        needs: install-dep

        defaults:
            run:
                working-directory: 13-caching/template
        steps:
            - name: Checkout-code
              uses: actions/checkout@v7
            - name: Setup-node
              uses: actions/setup-node@v6
              with:
                node-version: ${{ inputs.node-version }}
            - name: Download cached dependencies
              if: ${{ inputs.use-cache }}
              id: cache
              uses: actions/cache@v6
              with:
                path: 13-caching/template/node_modules
                key: ${{ needs.install-dep.outputs.deps-cache-key }}
            - name: Building
              run: npm run build
            - name: Deploying
              run: echo "deploying to non-prod"

