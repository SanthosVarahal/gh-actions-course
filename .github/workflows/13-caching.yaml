name: 13 - Using Caching

on:
    workflow_dispatch:
        inputs:
            use-cache:
                type: boolean
                description: Whether to execute cache step
                default: true
            node-version:
                type: choice
                options:
                    - 24.x
                    - 26.x
                default: 24.x
                

jobs:
    build:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: 13-caching/template
        steps:
            - name: Checkout-code
              uses: actions/checkout@v7
            - name: Setup-node
              uses: actions/setup-node@v6
              with:
                node-version: ${{ inputs.node-version }}
            - name: Download cached dependencies
              if: ${{ inputs.use-cache }}
              id: cache
              uses: actions/cache@v6
              with:
                path: 13-caching/template/node_modules
                key: deps-node-modules-${{ hashFiles('13-caching/template/package-lock.json') }}  
            - name: Install Dependencies
              if: steps.cache.outputs.cache-hit != 'true'
              run: npm ci
            - name: Testing
              run: npm run test
            - name: Building
              run: npm run build
            - name: Deploying
              run: echo "deploying to non-prod"

